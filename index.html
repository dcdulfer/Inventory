<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0C" />
  <title>Barraco's Daily Purchasing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">
  <header class="bg-[#0B0B0C] text-white px-4 py-3 flex items-center justify-between gap-3">
    <div class="font-extrabold tracking-wide text-base sm:text-lg">
      <span class="text-[#C82333]">BARRACO'S</span> DAILY PURCHASING
    </div>
    <nav class="flex gap-1.5" role="tablist">
      <button type="button" id="tab-btn-count" onclick="switchTab('count')" class="min-h-[44px] px-3.5 rounded-xl font-bold text-xs sm:text-sm bg-[#C82333] text-white">
        Daily Count (<span id="badge-count-tab">0</span>)
      </button>
      <button type="button" id="tab-btn-orders" onclick="switchTab('orders')" class="min-h-[44px] px-3.5 rounded-xl font-bold text-xs sm:text-sm bg-white/10 text-white">
        Orders (<span id="badge-orders-tab">0</span>)
      </button>
      <button type="button" id="tab-btn-manage" onclick="switchTab('manage')" class="min-h-[44px] px-3.5 rounded-xl font-bold text-xs sm:text-sm bg-white/10 text-white">
        Manage
      </button>
    </nav>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto p-4">
    <section id="view-count" class="space-y-4">
      <div id="location-bar" class="flex gap-2 overflow-x-auto pb-1"></div>
      <div id="count-items-list" class="space-y-2"></div>
    </section>

    <section id="view-orders" class="hidden space-y-4">
      <div id="orders-container" class="space-y-3"></div>
    </section>

    <section id="view-manage" class="hidden space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="font-extrabold text-base">Master Stock List</h2>
          <p class="text-xs text-slate-500">Add items, locations, or suppliers, or export/import CSV.</p>
        </div>
        <button type="button" onclick="exportCSV()" class="min-h-[44px] px-4 rounded-xl bg-slate-900 text-white font-bold text-xs sm:text-sm">
          Export CSV
        </button>
      </div>
      <div id="manage-items-list" class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "barracos_purchasing_v3";

    const DEFAULT_ITEMS = [
      { name: "Whole Milk Mozzarella Loaf", location: "Walk-In Cooler", supplier: "Grande Cheese / Greco", unit: "Case" },
      { name: "Fresh Mozzarella Ciliegine", location: "Walk-In Cooler", supplier: "Grande Cheese / Greco", unit: "Tub" },
      { name: "Shredded Provolone Cheese", location: "Walk-In Cooler", supplier: "Grande Cheese / Greco", unit: "Bag" },
      { name: "Sliced Pepperoni (Cup & Char)", location: "Walk-In Cooler", supplier: "Fontanini / Hormel", unit: "Case" },
      { name: "Italian Beef Roasts (Seasoned)", location: "Walk-In Cooler", supplier: "Vienna Beef / Scala", unit: "Case" },
      { name: "Crushed San Marzano Tomatoes", location: "Pizza Make Line", supplier: "Greco & Sons", unit: "Case" },
      { name: "Fresh Sliced Mushrooms", location: "Pizza Make Line", supplier: "Testa Produce", unit: "Case" },
      { name: "14-inch Thin Crust Dough Balls", location: "Prep & Dough Cooler", supplier: "Greco & Sons", unit: "Case" },
      { name: "Breaded Mozzarella Sticks", location: "Walk-In Freezer", supplier: "Sysco Chicago", unit: "Case" },
      { name: "Turano 8-inch French Rolls", location: "Dry Storage", supplier: "Turano Baking Co.", unit: "Case" },
      { name: "Homemade Tiramisu Trays", location: "Beverage & Dessert Cooler", supplier: "Greco & Sons", unit: "Tray" },
      { name: "Pepsi & Diet Pepsi 12 oz Cans", location: "Beverage & Dessert Cooler", supplier: "Pepsi Beverages", unit: "Case" }
    ];

    function buildInitialState() {
      const locations = [];
      const suppliers = [];
      const items = DEFAULT_ITEMS.map((row, idx) => {
        if (!locations.includes(row.location)) locations.push(row.location);
        if (!suppliers.includes(row.supplier)) suppliers.push(row.supplier);
        return {
          id: "item_" + (idx + 1),
          name: row.name,
          location: row.location,
          supplier: row.supplier,
          unit: row.unit,
          qty: 0
        };
      });
      return { items, locations, suppliers, activeLocation: locations[0] || "" };
    }

    function loadState() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return buildInitialState();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.items) || parsed.items.length === 0) return buildInitialState();
        return parsed;
      } catch (err) {
        return buildInitialState();
      }
    }

    let state = loadState();

    function saveState() {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {}
    }

    function switchTab(tab) {
      ["count", "orders", "manage"].forEach((t) => {
        const view = document.getElementById("view-" + t);
        const btn = document.getElementById("tab-btn-" + t);
        const isActive = t === tab;
        if (view) view.classList.toggle("hidden", !isActive);
        if (btn) {
          btn.className = isActive
            ? "min-h-[44px] px-3.5 rounded-xl font-bold text-xs sm:text-sm bg-[#C82333] text-white"
            : "min-h-[44px] px-3.5 rounded-xl font-bold text-xs sm:text-sm bg-white/10 text-white";
        }
      });
      if (tab === "count") renderCountView();
      if (tab === "orders") renderOrdersView();
      if (tab === "manage") renderManageView();
    }

    function stepQty(itemId, delta) {
      const item = state.items.find((i) => i.id === itemId);
      if (!item) return;
      item.qty = Math.max(0, (Number(item.qty) || 0) + delta);
      saveState();
      renderCountView();
    }

    function renderCountView() {
      const flagged = state.items.filter((i) => Number(i.qty) > 0);
      const suppliersCount = new Set(flagged.map((i) => i.supplier)).size;
      document.getElementById("badge-count-tab").textContent = flagged.length;
      document.getElementById("badge-orders-tab").textContent = suppliersCount;

      const locBar = document.getElementById("location-bar");
      locBar.innerHTML = "";
      state.locations.forEach((loc) => {
        const active = loc === state.activeLocation;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = loc;
        btn.className = active
          ? "min-h-[40px] px-3.5 rounded-xl text-xs font-bold bg-[#0B0B0C] text-white shrink-0"
          : "min-h-[40px] px-3.5 rounded-xl text-xs font-bold bg-white border border-slate-200 text-slate-700 shrink-0";
        btn.onclick = () => {
          state.activeLocation = loc;
          saveState();
          renderCountView();
        };
        locBar.appendChild(btn);
      });

      const list = document.getElementById("count-items-list");
      list.innerHTML = "";
      state.items
        .filter((i) => i.location === state.activeLocation)
        .forEach((item) => {
          const row = document.createElement("div");
          row.className = "bg-white rounded-2xl border border-slate-200 p-3.5 flex items-center justify-between gap-3";
          row.innerHTML =
            "<div><div class='font-bold text-sm'>" +
            item.name +
            "</div><div class='text-xs text-slate-500'>" +
            item.unit +
            " • " +
            item.supplier +
            "</div></div>" +
            "<div class='flex items-center gap-2'>" +
            "<button type='button' onclick=\"stepQty('" + item.id + "', -1)\" class='w-11 h-11 rounded-xl border border-slate-300 font-extrabold text-lg'>−</button>" +
            "<span class='w-8 text-center font-extrabold'>" + item.qty + "</span>" +
            "<button type='button' onclick=\"stepQty('" + item.id + "', 1)\" class='w-11 h-11 rounded-xl bg-[#15803D] text-white font-extrabold text-lg'>+</button>" +
            "</div>";
          list.appendChild(row);
        });
    }

    function renderOrdersView() {
      const container = document.getElementById("orders-container");
      const flagged = state.items.filter((i) => Number(i.qty) > 0);
      if (flagged.length === 0) {
        container.innerHTML = "<div class='bg-white rounded-2xl border border-slate-200 p-6 text-center text-sm text-slate-500'>No items with reorder quantity &gt; 0 yet.</div>";
        return;
      }
      const groups = {};
      flagged.forEach((it) => {
        if (!groups[it.supplier]) groups[it.supplier] = [];
        groups[it.supplier].push(it);
      });
      container.innerHTML = Object.keys(groups)
        .map((sup) => {
          const lines = groups[sup].map((i) => i.qty + " " + i.unit + " - " + i.name).join("\n");
          return "<div class='bg-white rounded-2xl border border-slate-200 p-4 space-y-2'><div class='font-extrabold text-base'>" + sup + "</div><pre class='bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-mono whitespace-pre-wrap'>" + lines + "</pre></div>";
        })
        .join("");
    }

    function renderManageView() {
      const list = document.getElementById("manage-items-list");
      list.innerHTML = state.items
        .map((it) => "<div class='p-3.5 flex items-center justify-between gap-2'><div><div class='font-bold text-sm'>" + it.name + "</div><div class='text-xs text-slate-500'>" + it.location + " • " + it.supplier + " • " + it.unit + "</div></div></div>")
        .join("");
    }

    function exportCSV() {
      const rows = ["Item Name,Stocking Location,Supplier,Unit"].concat(
        state.items.map((i) => '"' + i.name.replace(/"/g, '""') + '","' + i.location.replace(/"/g, '""') + '","' + i.supplier.replace(/"/g, '""') + '","' + i.unit.replace(/"/g, '""') + '"')
      );
      const blob = new Blob([rows.join("\r\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "barracos-stock-master.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    renderCountView();
  </script>
</body>
</html>
